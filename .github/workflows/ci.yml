name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer l'environnement Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.12"

      - name: Lancer flake8
        working-directory: app
        run: flake8 . --max-line-length=100

      - name: Installer yamllint
        run: pip install yamllint

      - name: Lancer yamllint sur les workflows
        run: yamllint .github/workflows

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Preparer l'environnement Python
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Lancer les tests avec couverture
        working-directory: app
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          COMMIT_SHA: ${{ github.sha }}
        run: |
          pytest -v --cov=. --cov-report=xml --junitxml=junit.xml

      - name: Publier les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            app/junit.xml
            app/coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Recuperer les rapports de tests (Python 3.12)
        uses: actions/download-artifact@v4
        with:
          name: test-results-3.12
          path: reports

      - name: Construire l'image (validation uniquement, pas de push)
        run: docker build -t devops-evaluation:${{ github.sha }} .

  ci-ok:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    timeout-minutes: 2
    steps:
      - name: Pipeline verte
        run: echo "lint, test et build sont verts"
