groups:
  - name: application
    rules:
      - alert: TauxErreurEleve
        expr: >
          sum(rate(http_requests_total{code=~"5.."}[1m]))
          / sum(rate(http_requests_total[1m])) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Taux d'erreur superieur a 5% depuis plus de 30s"

      - alert: LatenceDegradee
        expr: >
          histogram_quantile(0.95,
          sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 500ms depuis plus d'une minute"
